[tool.black]
line-length = 79
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "asyncpg.exceptions",
    "jinja2",
    "uvicorn",
    "jwt",
    "boto3",
    "moto",
    "botocore",
    "botocore.config",
    "google.cloud",
    "httpx",
    "qrcode"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `google` is a namespace package, so mypy resolves part of it and then
# complains about the rest. Skipping is scoped to `google` alone, so it
# doesn't quietly reduce checking elsewhere.
module = ["google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
omit = [
    "*/piccolo_app.py",
    "*/piccolo_migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "return self.render_template",
    "raise HTTPException",
]